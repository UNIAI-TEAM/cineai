# PRINTFILM 全栈（本地构建）。推 ACR：acr_push.ps1 -ComposeFile docker-compose.prod.yml
# 启动：cp deploy/.env.prod.example deploy/.env.prod
#       docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build
name: printfilm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printfilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-printfilm}
    volumes:
      - printfilm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfilm} -d ${POSTGRES_DB:-printfilm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - printfilm_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "16379:6379"

  api:
    image: registry-harbor.ubos.vn/cineai/printfilm-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-printfilm}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@postgres:5432/${POSTGRES_DB:-printfilm}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-printfilm}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@postgres:5432/${POSTGRES_DB:-printfilm}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - printfilm_media:/app/static/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    image: registry-harbor.ubos.vn/cineai/printfilm-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:80"

  admin-web:
    image: registry-harbor.ubos.vn/cineai/printfilm-admin-web:latest
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9091:80"

volumes:
  printfilm_pgdata:
  printfilm_redisdata:
  printfilm_media:
